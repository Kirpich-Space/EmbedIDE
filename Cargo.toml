[workspace]
members = ["crates/embedide-project", "crates/embedide-core", "crates/embedide-cli", "crates/embedide-editor", "crates/embedide-terminal"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
embedide-project = { path = "crates/embedide-project" }
embedide-core = { path = "crates/embedide-core" }
embedide-editor = { path = "crates/embedide-editor" }
embedide-terminal = { path = "crates/embedide-terminal" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.release]
lto = "thin"
strip = true

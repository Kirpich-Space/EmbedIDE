[workspace]
members = ["crates/embedide-project", "crates/embedide-core", "crates/embedide-cli", "crates/embedide-editor", "crates/embedide-terminal", "crates/embedide-toolchains", "crates/embedide-workspace", "crates/embedide-build", "crates/embedide-ai"]
resolver = "2"

[workspace.package]
version = "0.2.0-alpha.2"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
embedide-project = { path = "crates/embedide-project" }
embedide-core = { path = "crates/embedide-core" }
embedide-editor = { path = "crates/embedide-editor" }
embedide-terminal = { path = "crates/embedide-terminal" }
embedide-toolchains = { path = "crates/embedide-toolchains" }
embedide-workspace = { path = "crates/embedide-workspace" }
embedide-build = { path = "crates/embedide-build" }
embedide-ai = { path = "crates/embedide-ai" }
toml = "1.2"
toml_edit = "0.25"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.release]
lto = "thin"
strip = true

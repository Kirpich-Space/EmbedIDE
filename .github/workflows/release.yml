name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux (AppImage + deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npx electron-builder --linux --x64 --publish=never

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            release/*.AppImage
            release/*.deb

  build-win:
    name: Windows (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npx electron-builder --win --x64 --publish=never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe

  build-mac:
    name: macOS (DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npx electron-builder --mac --publish=never

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release/*.dmg

  create-release:
    name: Create Release
    needs: [build-linux, build-win, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release body
        run: |
          echo "## EmbedIDE ${{ github.ref_name }}" > release-notes.md
          echo "" >> release-notes.md
          echo "Offline-first engineering IDE for embedded flight computers (Kirpich Space)." >> release-notes.md
          echo "" >> release-notes.md
          echo "Download the installer for your platform:" >> release-notes.md
          echo "" >> release-notes.md
          echo "| Platform | File |" >> release-notes.md
          echo "|----------|------|" >> release-notes.md
          echo "| Linux (AppImage) | \`embed-ide-*-x64.AppImage\` / \`embed-ide-*-x86_64.AppImage\` |" >> release-notes.md
          echo "| Linux (Debian) | \`embed-ide-*.deb\` |" >> release-notes.md
          echo "| Windows | \`embed-ide-Setup-*.exe\` |" >> release-notes.md
          echo "| macOS | \`embed-ide-*.dmg\` |" >> release-notes.md
          echo "" >> release-notes.md
          echo "See CHANGELOG.md for details." >> release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: EmbedIDE ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            artifacts/linux-installers/*
            artifacts/windows-installer/*
            artifacts/macos-dmg/*
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release macOS

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: embedide-macos
          path: release/*.{dmg,zip,yml,yaml,json,blockmap}

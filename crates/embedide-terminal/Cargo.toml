[package]
name = "embedide-terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["tui"]
tui = ["dep:crossterm", "dep:unicode-segmentation", "dep:unicode-width", "dep:signal-hook", "dep:nix", "dep:embedide-core", "dep:serde_json", "dep:portable-pty", "dep:vt100", "dep:embedide-build", "dep:embedide-workspace", "dep:embedide-toolchains", "dep:embedide-ai"]

[dependencies]
embedide-editor.workspace = true
embedide-core = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
embedide-build = { workspace = true, optional = true }
embedide-workspace = { workspace = true, optional = true }
embedide-toolchains = { workspace = true, optional = true }
embedide-ai = { workspace = true, optional = true }
portable-pty = { version = "0.9", optional = true }
vt100 = { version = "0.16", optional = true }
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste"], optional = true }
unicode-segmentation = { version = "1.12", optional = true }
unicode-width = { version = "0.2", optional = true }

[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.3", optional = true }
nix = { version = "0.30", features = ["signal"], optional = true }

[lints]
workspace = true

[[bench]]
name = "tui"
harness = false
required-features = ["tui"]

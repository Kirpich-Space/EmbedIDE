[package]
name = "embedide-terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["tui"]
tui = ["dep:crossterm", "dep:unicode-segmentation", "dep:unicode-width", "dep:signal-hook", "dep:embedide-core", "dep:serde_json"]

[dependencies]
embedide-editor.workspace = true
embedide-core = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
crossterm = { version = "0.29", default-features = false, features = ["events", "bracketed-paste", "windows"], optional = true }
unicode-segmentation = { version = "1.12", optional = true }
unicode-width = { version = "0.2", optional = true }

[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.3", optional = true }

[lints]
workspace = true

[[bench]]
name = "tui"
harness = false
required-features = ["tui"]
